name: Static quality

on:
  pull_request:
    paths:
      - "index.html"
      - "pages/**"
      - "fotos/**"
      - "scss/**"
      - "css/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".gitignore"
      - "README.md"
      - ".github/workflows/static-quality.yml"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "pages/**"
      - "fotos/**"
      - "scss/**"
      - "css/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".gitignore"
      - "README.md"
      - ".github/workflows/static-quality.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Reject tracked generated dependencies
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files node_modules | grep -q .; then
            echo 'node_modules must not be tracked.' >&2
            exit 1
          fi

      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Audit dependency tree
        run: npm audit --audit-level=high

      - name: Validate site and compiled CSS authority
        run: npm test

      - name: Smoke static pages over HTTP
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/la-casa-del-vino-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null; then
              break
            fi
            sleep 0.25
          done

          pages=(
            index.html
            pages/tiposDeVinos.html
            pages/conocenos.html
            pages/contacto.html
            pages/subscribite.html
          )
          for page in "${pages[@]}"; do
            body="$(curl --fail --silent --show-error "http://127.0.0.1:4173/${page}")"
            grep -F '<title>La Casa del Vino</title>' <<<"$body" >/dev/null
          done

          curl --fail --silent --show-error http://127.0.0.1:4173/css/style.css >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/fotos/vineLogo.png >/dev/null
